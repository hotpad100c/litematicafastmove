plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// EXIT (emergency_exit) comes from JitPack, built from https://github.com/Shader-Escape/emergency-exit
	exclusiveContent {
		forRepository {
			maven { url = "https://jitpack.io" }
		}
		filter {
			includeGroup "com.github.Shader-Escape.emergency-exit"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		// forRepositories(fg.repository) // Uncomment when using ForgeGradle
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

// EXIT: always the newest release for this Minecraft version. JitPack lists the versions of every Minecraft version
// under one artifact, so the others are rejected before + picks the newest. A pinned branch snapshot is let through.
configurations.configureEach {
	resolutionStrategy {
		componentSelection.all { ComponentSelection selection ->
			if (selection.candidate.group == 'com.github.Shader-Escape.emergency-exit'
				&& !selection.candidate.version.endsWith("-${project.exit_minecraft_version}")
				&& !selection.candidate.version.endsWith('-SNAPSHOT')) {
				selection.reject("EXIT for another Minecraft version than ${project.exit_minecraft_version}")
			}
		}
		cacheDynamicVersionsFor 10, 'minutes'
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"


	implementation "maven.modrinth:bEpr0Arc:ZqV316KY" // Litematica 0.29.1
	implementation "maven.modrinth:malilib:0.30.2"

	// EXIT routes the schematic rendering past shader packs. Nested, so players do not install it separately.
	// The Fabric jar carries the whole library (its own classes and the common ones), so the one artifact is enough.
	implementation("com.github.Shader-Escape.emergency-exit:emergency_exit-fabric:${project.exit_version}") { transitive = false }
	include("com.github.Shader-Escape.emergency-exit:emergency_exit-fabric:${project.exit_version}")

	// Iris and Sodium for the development runs only, the same versions EXIT is built against.
	localRuntime "maven.modrinth:YL57xq9U:${project.iris_version}"
	localRuntime "maven.modrinth:AANobbMI:${project.sodium_version}"
	// Iris nests these in its jar, but the development runtime does not load nested jars of dependencies.
	for (library in ["org.anarres:jcpp:1.4.14", "org.antlr:antlr4-runtime:4.13.1", "io.github.douira:glsl-transformer:3.0.0-pre3"]) {
		localRuntime(library) { transitive = false }
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
