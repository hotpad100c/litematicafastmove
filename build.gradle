plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// EXIT (emergency_exit) is not published anywhere yet: `./gradlew :26.3:publishToMavenLocal` in its repository.
	exclusiveContent {
		forRepository {
			mavenLocal()
		}
		filter {
			includeGroup "ml.mypals.exit"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		// forRepositories(fg.repository) // Uncomment when using ForgeGradle
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"


	modImplementation "maven.modrinth:bEpr0Arc:${project.litematica_version}" // Litematica 0.0.0-dev.20210917
	modImplementation "maven.modrinth:malilib:${project.malilib_version}" // malilib 0.10.0-dev.21+arne.8

	// EXIT routes the schematic rendering past shader packs. Nested, so players do not install it separately.
	// The Fabric jar carries the whole library (its own classes and the common ones), so the one artifact is enough.
	modImplementation("ml.mypals.exit:emergency_exit-fabric:${project.exit_version}") { transitive = false }
	include("ml.mypals.exit:emergency_exit-fabric:${project.exit_version}")

	// Iris and Sodium for the development runs only, the same versions EXIT is built against.
	modLocalRuntime "maven.modrinth:YL57xq9U:${project.iris_version}"
	modLocalRuntime "maven.modrinth:AANobbMI:${project.sodium_version}"
}

// Iris and Sodium nest libraries (jcpp, ANTLR, glsl-transformer, JOML before 1.19.3; versions differ per build) in
// their jars, but the development runtime does not load the nested jars of dependencies; without them Iris fails as
// soon as it reads a shader pack. The set and versions differ per Minecraft version, so take the copies from those
// jars themselves.
def nestingJars = configurations.detachedConfiguration(
		dependencies.create("maven.modrinth:YL57xq9U:${project.iris_version}"),
		dependencies.create("maven.modrinth:AANobbMI:${project.sodium_version}")
)
nestingJars.transitive = false
def nestedLibraries = tasks.register('nestedLibraries', Sync) {
	from({ nestingJars.files.collect { zipTree(it) } }) {
		include 'META-INF/jars/*.jar'
		exclude 'META-INF/jars/fabric-*'
		// Older Iris nests slf4j as a generated mod, which on the classpath hides every mod from Fabric Loader.
		exclude 'META-INF/jars/slf4j-*'
		eachFile { path = name }
	}
	includeEmptyDirs = false
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	into layout.buildDirectory.dir('nestedLibraries')
}

dependencies {
	localRuntime(fileTree(nestedLibraries.map { it.destinationDir }) { include '*.jar' }.builtBy(nestedLibraries))
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 16
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_16
	targetCompatibility = JavaVersion.VERSION_16
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
