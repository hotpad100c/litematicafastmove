name: build
on: [pull_request, push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout LFM
        uses: actions/checkout@v6
      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@v6
      - name: Install compile toolchains and Gradle JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            16
            17
            21
            25
      - name: Build LFM
        run: |
          chmod +x ./gradlew
          ./gradlew build --console=plain
      - name: Verify player jar and nested EXIT
        run: python3 scripts/verify-package.py
      - name: Upload verified player package
        uses: actions/upload-artifact@v7
        with:
          name: LFM-1.21.8
          if-no-files-found: error
          path: |
            build/libs/litematicafastmove-1.0.0+1.21.8.jar
            build/libs/checksums.sha256
            build/libs/package-verification.json
