name: build
on: [pull_request, push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout LFM
        uses: actions/checkout@v6
      - name: Checkout matching EXIT
        uses: actions/checkout@v6
        with:
          repository: hotpad100c/emergency-exit
          ref: b55037ab28f66f534bd40e8ee0380b3dc8604b90
          path: .exit-source
      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@v6
      - name: Install compile toolchains and Gradle JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            16
            17
            21
            25
      - name: Publish EXIT into this runner's local Maven
        working-directory: .exit-source
        run: |
          chmod +x ./gradlew
          ./gradlew :fabric:publishToMavenLocal --init-script ../scripts/exit-publication.init.gradle --console=plain -Porg.gradle.java.installations.fromEnv=JAVA_HOME_16_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64
      - name: Build LFM
        run: |
          chmod +x ./gradlew
          ./gradlew build --console=plain
      - name: Verify player jar and nested EXIT
        run: python3 scripts/verify-package.py
      - name: Upload verified player package
        uses: actions/upload-artifact@v7
        with:
          name: LFM-1.20.2
          if-no-files-found: error
          path: |
            build/libs/litematicafastmove-1.0.0+1.20.2.jar
            build/libs/checksums.sha256
            build/libs/package-verification.json
